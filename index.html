<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }
    .card {
      background: white; padding: 40px; border-radius: 20px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 90%; max-width: 400px;
    }
    h1 { color: #ff4d6d; margin-bottom: 30px; }
    .buttons { position: relative; height: 150px; margin-top: 30px; }
    button {
      padding: 12px 25px; font-size: 18px; border-radius: 10px;
      border: none; cursor: pointer; position: absolute; transition: 0.2s ease;
    }
    #yesBtn {
      background: #ff4d6d; color: white; left: 50%;
      transform: translateX(-120%);
    }
    #noBtn {
      background: #ccc; color: #333; left: 50%;
      transform: translateX(20%);
    }
    .message {
      display: none; margin-top: 20px; font-size: 20px; color: #ff4d6d;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yesBtn">Yes 💘</button>
      <button id="noBtn">No 😢</button>
    </div>
    <div class="message" id="message">
      YAY!!! 💕 I love you so much 😭❤️
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const message = document.getElementById('message');

    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('click', moveButton);

    function moveButton() {
      const container = document.querySelector('.buttons');
      const maxX = container.clientWidth - noBtn.clientWidth;
      const maxY = container.clientHeight - noBtn.clientHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    yesBtn.addEventListener('click', () => {
      message.style.display = 'block';
      yesBtn.style.display = 'none';
      noBtn.style.display = 'none';
    });
  </script>
</body>
</html>
